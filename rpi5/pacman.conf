# pacman.conf for building the rpi5 live system: Arch Linux ARM's repos,
# used whether the build container is Arch Linux ARM (arm64 host) or
# Arch Linux (amd64 host).
#
# pacstrap runs pacman in builder's nested user namespace, where its
# download sandbox can't switch to the alpm user, so it is off (no
# DownloadUser, DisableSandbox).

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
DisableSandbox

[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = http://mirror.archlinuxarm.org/$arch/$repo
