<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>BOOMSTICK</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#14305a"/>
      <stop offset="0.6" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#050b16"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cc4ff"/>
      <stop offset="1" stop-color="#1d6fe0"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d6fe0" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#5fc0ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f8"/>
      <stop offset="1" stop-color="#9aa6b4"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fd8ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="disc"><circle cx="256" cy="256" r="236"/></clipPath>
  </defs>

  <!-- Badge -->
  <circle cx="256" cy="256" r="236" fill="url(#bg)"/>

  <g clip-path="url(#disc)">
    <!-- Smoke clouds at the launch point -->
    <g fill="#8fb8e8" opacity="0.55">
      <circle cx="70" cy="350" r="46"/>
      <circle cx="120" cy="372" r="40"/>
      <circle cx="40" cy="392" r="44"/>
      <circle cx="165" cy="392" r="30"/>
    </g>
    <g fill="#d6e8ff" opacity="0.6">
      <circle cx="95" cy="365" r="26"/>
      <circle cx="140" cy="384" r="20"/>
    </g>

    <!-- Speed lines -->
    <g stroke="#5fc0ff" stroke-width="5" stroke-linecap="round" opacity="0.5">
      <line x1="60" y1="250" x2="150" y2="205"/>
      <line x1="95" y1="300" x2="170" y2="262"/>
      <line x1="40" y1="300" x2="80" y2="280"/>
    </g>

    <!-- Rocket plume behind the stick -->
    <g transform="rotate(-35 256 256)">
      <path d="M -10 256 C 80 196, 170 214, 200 226 L 200 286 C 170 298, 80 316, -10 256 Z"
            fill="url(#plume)" filter="url(#glow)"/>
      <path d="M 90 256 C 140 234, 180 238, 200 242 L 200 270 C 180 274, 140 278, 90 256 Z"
            fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- USB stick -->
  <g transform="rotate(-35 256 256)" filter="url(#glow)">
    <rect x="190" y="208" width="170" height="96" rx="22" fill="url(#body)" stroke="#5fc0ff" stroke-width="4"/>
    <rect x="360" y="222" width="66" height="68" rx="6" fill="url(#metal)" stroke="#6f7c8c" stroke-width="2"/>
    <rect x="382" y="238" width="16" height="12" rx="2" fill="#3b4656"/>
    <rect x="382" y="262" width="16" height="12" rx="2" fill="#3b4656"/>
    <!-- Lightning bolt emblem -->
    <path d="M 284 220 L 250 262 L 272 262 L 258 294 L 300 248 L 276 248 L 290 220 Z"
          fill="#5fc0ff" stroke="#bfe6ff" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- WiFi -->
  <g fill="none" stroke="#bfe6ff" stroke-width="7" stroke-linecap="round" transform="translate(132 112)">
    <path d="M -34 -8 A 48 48 0 0 1 34 -8"/>
    <path d="M -22 4 A 31 31 0 0 1 22 4"/>
    <path d="M -10 16 A 14 14 0 0 1 10 16"/>
  </g>
  <circle cx="132" cy="135" r="5" fill="#bfe6ff"/>

  <!-- Padlock (VPN) -->
  <g transform="translate(372 118)" stroke-linejoin="round">
    <path d="M -15 0 V -12 A 15 15 0 0 1 15 -12 V 0" fill="none" stroke="#bfe6ff" stroke-width="7"/>
    <rect x="-24" y="-2" width="48" height="38" rx="7" fill="#1d6fe0" stroke="#bfe6ff" stroke-width="4"/>
    <circle cx="0" cy="13" r="5" fill="#bfe6ff"/>
    <rect x="-2.5" y="14" width="5" height="11" rx="2" fill="#bfe6ff"/>
  </g>

  <!-- Terminal -->
  <g transform="translate(108 196)">
    <rect x="-30" y="-22" width="60" height="46" rx="7" fill="#0b1426" stroke="#bfe6ff" stroke-width="4"/>
    <path d="M -17 -8 L -5 1 L -17 10" fill="none" stroke="#5fc0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1" y1="11" x2="16" y2="11" stroke="#5fc0ff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Single-board computer -->
  <g transform="translate(402 300)">
    <rect x="-34" y="-24" width="68" height="48" rx="6" fill="#123a2a" stroke="#bfe6ff" stroke-width="4"/>
    <rect x="-12" y="-11" width="24" height="22" rx="3" fill="#0b1426" stroke="#5fc0ff" stroke-width="2"/>
    <g fill="#d9b44a">
      <rect x="-28" y="-19" width="4" height="4"/><rect x="-20" y="-19" width="4" height="4"/>
      <rect x="-28" y="15" width="4" height="4"/><rect x="-20" y="15" width="4" height="4"/>
      <rect x="18" y="-19" width="4" height="4"/><rect x="24" y="-19" width="4" height="4"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"
     font-style="italic" text-anchor="middle">
    <text x="256" y="430" font-size="62" letter-spacing="1"
          fill="none" stroke="#1d6fe0" stroke-width="12" stroke-linejoin="round">BOOMSTICK</text>
    <text x="256" y="430" font-size="62" letter-spacing="1"
          fill="url(#text)" stroke="#0a1830" stroke-width="2">BOOMSTICK</text>
  </g>

  <!-- Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring)" stroke-width="10"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#0a1830" stroke-width="6"/>
</svg>
