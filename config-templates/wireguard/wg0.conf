# WireGuard config for this image, in wg-quick(8) format.
# The private key should be unique to this image:
#   wg genkey | tee /dev/stderr | wg pubkey      (or: just keygen)
# Uncomment and fill in, or leave it all commented out to boot without
# WireGuard:
#
# [Interface]
# PrivateKey = <this image's private key>
# Address = 10.0.0.2/32
# Optional, resolved via systemd-resolved:
# DNS = 10.0.0.1
#
# [Peer]
# PublicKey = <peer's public key>
# Endpoint = vpn.example.com:51820
# AllowedIPs = 10.0.0.0/24
# Required, so the peer can reach this image through NAT:
# PersistentKeepalive = 25
